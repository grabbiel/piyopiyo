name: PiyoPiyo
schemes:
  PiyoPiyo-iOS:
    build:
      targets:
        PiyoPiyo-iOS: all
  PiyoPiyo-iPadOS:
    build:
      targets:
        PiyoPiyo-iPadOS: all
  PiyoPiyo-macOS:
    build:
      targets:
        PiyoPiyo-macOS: all
options:
  bundleIdPrefix: app.piyopiyo
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  PiyoPiyoCore:
    path: PiyoPiyoCore
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
settings:
  base:
    SWIFT_VERSION: '5.10'
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '4'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3LYWV7T9MT
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: PiyoPiyo
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
targetTemplates:
  NativeApp:
    type: application
    sources: [App]
    dependencies:
      - package: PiyoPiyoCore
    info:
      path: App/Info-${target_name}.plist
      properties:
        CFBundleDisplayName: PiyoPiyo
        CFBundleURLTypes:
          - CFBundleURLName: app.piyopiyo.auth
            CFBundleURLSchemes: [piyopiyo]
        ITSAppUsesNonExemptEncryption: false
targets:
  PiyoPiyo-iOS:
    templates: [NativeApp]
    platform: iOS
    info:
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CURRENT_PROJECT_VERSION: '5'
        PRODUCT_BUNDLE_IDENTIFIER: app.piyopiyo.iphone
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PiyoPiyo iPhone App Store
  PiyoPiyo-iPadOS:
    templates: [NativeApp]
    platform: iOS
    info:
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CURRENT_PROJECT_VERSION: '5'
        PRODUCT_BUNDLE_IDENTIFIER: app.piyopiyo.iphone
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PiyoPiyo iPhone App Store
  PiyoPiyo-macOS:
    templates: [NativeApp]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.piyopiyo.mac
        PRODUCT_NAME: PiyoPiyo
        CODE_SIGN_ENTITLEMENTS: App/Mac.entitlements
      configs:
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  PiyoPiyo-iPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PiyoPiyoCore/Tests/PiyoPiyoCoreTests
        excludes: ["__Snapshots__"]
    dependencies:
      - package: PiyoPiyoCore
      - package: SnapshotTesting
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: app.piyopiyo.iphone.tests
    scheme:
      testTargets: [PiyoPiyo-iPhoneTests]
  PiyoPiyo-iPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PiyoPiyoCore/Tests/PiyoPiyoCoreTests
        excludes: ["__Snapshots__"]
    dependencies:
      - package: PiyoPiyoCore
      - package: SnapshotTesting
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '2'
        PRODUCT_BUNDLE_IDENTIFIER: app.piyopiyo.ipad.tests
    scheme:
      testTargets: [PiyoPiyo-iPadTests]
